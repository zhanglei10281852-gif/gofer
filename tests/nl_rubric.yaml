rubrics:
  - id: 1
    type: f2p
    text: 从联系人详情选定一份 CardDAV 来源可移至本人另一已有地址簿；同一联系人的第三份来源仍保留，其他账号或地址簿不会被连带删除。
  - id: 2
    type: f2p
    text: 目标副本保留所选源 vCard 的照片和界面未展示的属性；目标存在不同内容时停止并保留双方原内容，不能以统一资料重建后静默覆盖。
  - id: 3
    type: f2p
    text: 目标写入失败不会删除源；目标落盘后响应或本地确认失败，重启并继续会确认同一目标副本，不创建重复目标，确认完成前不删源。
  - id: 4
    type: f2p
    text: 目标确认后源版本发生变化时，条件删除被拒绝，界面显示冲突并保留新源及已有目标，未经用户重新确认不得强制删除或自动覆盖。
  - id: 5
    type: f2p
    text: 源已删除而本地收尾提交失败后，继续操作能确认远端缺失并只移除所选本地来源，最终显示完成，不重新复制或把整个联系人标为已删除。
  - id: 6
    type: f2p
    text: 在移动复制与删除之间触发入站同步或已排队的 Gofer Sync，移动完成后再次同步，源不会被重建，目标内容与其余复制位置保持正确。
  - id: 7
    type: f2p
    text: 刷新、重启或账号服务失效后仍可查询移动的真实阶段；同一移动的重复继续请求不会另起一份移动，部分成功不会显示成全部完成。
  - id: 8
    type: p2p
    text: 未发起移动时，普通编辑和导入仍可使用，移除 Gofer Sync 目标仍只停止复制而保留远端副本，联系人回收站和永久删除维持原有范围。
