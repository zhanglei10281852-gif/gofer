rubrics:
  - id: 1
    type: f2p
    text: 可创建每日或指定星期的重复寄信计划并查看下一日期；连续两个日期产生不同邮件身份，各自保留内容与结果，同一日期的重试复用原发送快照。
  - id: 2
    type: f2p
    text: 以固定时区验证夏令时缺失和重复本地时刻：缺失日期显示跳过，重复时刻仅发送一次，之后的发送仍按本地日历时刻推进。
  - id: 3
    type: f2p
    text: 停机跨过多个计划日期后，恢复只补最近一个已到期日期，较早日期显示跳过；实例创建失败、重复唤醒或提交后重启均不重复创建同一日期的发送。
  - id: 4
    type: f2p
    text: 计划保存后编辑或删除原草稿、完成首次发送并运行常规附件清理，下一次发送仍包含计划保存的正文和附件，结束后按剩余实例引用释放文件。
  - id: 5
    type: f2p
    text: 某次发送在提交前受到暂时拒绝时只重试该次且不漂移未来日期；DATA 提交后失去结果并重启时该次保持不确定、未经明确确认不自动重发，后续日期仍可独立执行。
  - id: 6
    type: f2p
    text: 编辑、暂停或结束计划与后台生成实例交错时，已产生的实例维持原内容，变更生效后不按旧计划再产生实例；恢复计划不补发暂停期间的日期。
  - id: 7
    type: f2p
    text: 刷新或重启后的计划详情准确区分各次待发、失败、不确定、已发送及已跳过结果，部分发送失败不能被计划的下一次日期或成功实例掩盖。
  - id: 8
    type: p2p
    text: 关闭重复选项时即时发送和单次预约保持原行为，已有发件身份选择及 Sent 副本失败恢复不产生额外邮件或重复 SMTP 提交。
