rubrics:
  - id: 1
    type: f2p
    text: 开启报告选项并保存草稿或预约后，支持 DSN 的 SMTP 会话携带绑定该发送的信封标识和逐收件人通知参数；普通重试仍关联同一请求。
  - id: 2
    type: f2p
    text: SMTP 未声明支持 DSN 时邮件仍正常提交且发送详情说明报告不可用；服务器接受邮件与收件人投递状态分别显示，没有报告不会显示为投递成功或失败。
  - id: 3
    type: f2p
    text: 通过真实读信入口读取一封包含不同收件人结果的标准报告，会分别更新对应收件人的延迟、投递或失败；无效段落、陌生标识和原信封之外的地址不改写其他记录，普通正文仍可阅读。
  - id: 4
    type: f2p
    text: 完成发送并清理 MIME 快照后，在发送记录保留期内收到报告仍可关联原收件人，包括密送；密送地址不会写入发给其他人的邮件头部或正文。
  - id: 5
    type: f2p
    text: 重复读取、重复接收及重启后处理同一报告不会重复累计；已经确认成功或失败的收件人不会被晚到的延迟通知退回等待，其他收件人保持各自状态。
  - id: 6
    type: f2p
    text: 正文下载失败不改变投递结果，后续成功读取可继续处理；报告状态提交失败后，再次打开已有缓存会补处理未确认结果，期间不重发原邮件。
  - id: 7
    type: f2p
    text: 发送详情能同时展示不同收件人的不同结果，报告本身仍可阅读下载；发送记录超过现有保留期被清理时，其报告关联不会遗留或串到后来发送。
  - id: 8
    type: p2p
    text: 未请求报告及非 SMTP 的普通发送保持原行为，现有不确定投递提示、人工重试确认和 Sent 副本恢复继续有效，不因报告处理额外提交邮件。
